{% extends "base.html" %}

{% block conteudo %}
<div class="flex flex-col items-center justify-center min-h-screen space-y-6">
    <h1 class="text-2xl font-bold">Sacar saldo 💳</h1>

    {% if erro %}
        <p class="text-red-500">{{ erro }}</p>
    {% endif %}

    <form method="post">
        <input
            type="number"
            name="valor do saque: R$"
            placeholder="Valor do saque"
            class="px-4 py-2 text-black rounded-lg"
            required>
        <button
            type="submit"
            class="ml-2 px-6 py-2 bg-red-500 text-black font-bold rounded-lg">
            Sacar 💰
        </button>
    </form>

    <a href="{{ url_for('tela_inicio') }}" class="underline">
        Voltar 🔄
    </a>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/warning.js') }}"></script>
{% endblock %}
